version: 2.0
engine: KME
mode: audio_subtitle_sync
source:
  audio: audio/narration.wav
  subtitles: timing/captions.srt
delivery:
  width: 1920
  height: 1080
  fps: 30
  profile: baseline
  bframes: 0
scenes:
  - id: S01
    start: 0.0
    end: 10.0
    states:
      - at: 0.20
        action: reveal
        target: title
        narration_anchor: core_topic
        hold: 1.2
      - at: 2.00
        action: accumulate
        target: point_1
        keep: [title]
        hold: 1.0
      - at: 4.00
        action: accumulate
        target: point_2
        keep: [title, point_1]
        hold: 1.0
      - at: 6.00
        action: focus
        target: point_2
        dim: [point_1]
        hold: 1.2
      - at: 8.00
        action: summarize
        restore: [title, point_1, point_2]
        hold: 1.5
principles:
  - visuals_follow_spoken_claims
  - previous_information_persists
  - one_focus_per_moment
  - native_frame_rendering
  - restrained_editorial_controls
