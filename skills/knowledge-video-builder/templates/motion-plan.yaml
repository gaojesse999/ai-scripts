schema_version: "1.1"
renderer: hyperframes
timing_source: timing/sentences.json
audio_duration_seconds: 0.00

# 密度闸门：每个场景实现前先确认这五项。
density:
  dominant_focus: "当前口播对应的那一个对象"
  supporting_group: "已介绍但退为 dormant 的上下文"
  metadata_on_canvas: false
  redundant_summary: false
  decorative_connections: false

# at / hold_until 为场景内本地时间，来自真实对齐结果，不是估算。
# anchor 是 timing/beats.json 里的叙述单元 id；composition 里的关键帧用它写成 B(anchor)。
# 已出现的对象退为 dormant(0.32)，当前对象为 present(1.0)，禁止中间透明度带。
scenes:
  - scene_id: S01
    global_start: 0.00
    duration: 0.00
    states:
      - at: 0.00
        action: reveal
        target: headline
        anchor: S01.1
        hold_until: 0.00
        reason: "口播给出本章要解决的问题"
      - at: 0.00
        action: accumulate
        target: point-1
        anchor: S01.2
        keep: [headline]
        hold_until: 0.00
        reason: "口播点出第一个失败模式"
      - at: 0.00
        action: focus
        target: point-2
        anchor: S01.3
        keep: [headline, point-1]
        hold_until: 0.00
        reason: "口播转到第二个失败模式，重音随之移动"
      - at: 0.00
        action: summarize
        target: complete-set
        anchor: S01.4
        restore: [point-1, point-2]
        hold_until: 0.00
        reason: "退出前给出完整结构的稳定停留"

principles:
  - visuals_follow_spoken_claims
  - previous_information_persists
  - one_focus_per_moment
  - native_frame_rendering
  - restrained_editorial_controls
